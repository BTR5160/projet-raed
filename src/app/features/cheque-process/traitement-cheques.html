<div class="treatment-page">
  <h1>Traiter Chèque</h1>
  @if (isLoading()) { <p>Analyse OCR en cours...</p> }
  @if (!isLoading() && cheque()) {
    <form [formGroup]="treatmentForm" (ngSubmit)="onSubmit()">
      <input formControlName="emitterName" />
      <input formControlName="beneficiaryName" />
      <input formControlName="amountNumeric" type="number" />
      <button type="submit" [disabled]="treatmentForm.invalid || isSubmitting()">Valider</button>
      <button type="button" (click)="onReject()" [disabled]="isSubmitting()">Rejeter</button>
    </form>
  }
</div>
